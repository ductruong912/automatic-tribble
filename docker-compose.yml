services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8500}:${PORT:-8500}"
    env_file:
      - .env
    environment:
      - LOG_DIR=/app/logs
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount logs directory for log persistence
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8500}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=2G
    command: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8500} --workers ${UVICORN_WORKERS:-1}

